<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Blue Cranes Cycling Club">
    <title>Blue Cranes Cycling Club</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="site-shell">
      <section class="gate" id="gate" aria-labelledby="gate-title">
        <a class="public-join" href="https://tally.so/r/44qRrA" target="_blank" rel="noreferrer">
          Request to join
        </a>
        <div class="brand-lockup">
          <img src="assets/blue-cranes-logo-transparent.png" alt="Blue Cranes Cycling Club sketch logo">
        </div>
        <form class="password-panel" id="password-form">
          <label for="club-password" id="gate-title">Members only</label>
          <div class="password-row">
            <input id="club-password" name="password" type="password" autocomplete="current-password" placeholder="Enter password">
            <button type="submit">Enter</button>
          </div>
          <p class="hint" id="password-message">Members receive the access code directly.</p>
        </form>
      </section>

      <section class="bike-transition" id="bike-transition" hidden aria-hidden="true">
        <div class="bike-road">
          <img class="bike-drawing" src="assets/bike-drawn-transparent.png" alt="">
        </div>
      </section>

      <section class="club-home" id="club-home" hidden>
        <header class="club-header">
          <img src="assets/blue-cranes-logo-transparent.png" alt="Blue Cranes Cycling Club sketch logo">
          <nav class="tabs" aria-label="Club sections">
            <button class="tab is-active" type="button" data-tab="club">Club</button>
            <a class="tab tab-link" href="https://blue-cranes-shop.fourthwall.com" target="_blank" rel="noreferrer">Lifestyle</a>
            <a class="tab tab-link" href="cycling-kit.html">Cycling Kit</a>
          </nav>
        </header>

        <section class="tab-panel is-active" id="club" aria-labelledby="club-tab">
          <div class="intro">
            <p class="eyebrow">Blue Cranes Cycling Club</p>
            <h1>Two big, two small, then coffee.</h1>
            <p>Simple rides, clean kit, cafe stops, and a quiet little corner for members.</p>
          </div>
          <div class="club-grid">
            <a class="link-card" href="https://www.strava.com/clubs/2206497" target="_blank" rel="noreferrer">
              <span>Strava</span>
              <strong>Join the club</strong>
            </a>
            <a class="link-card" href="https://chat.whatsapp.com/Dou3VXd2pmxBJ7wNEheyNd" target="_blank" rel="noreferrer">
              <span>WhatsApp</span>
              <strong>Group chat</strong>
            </a>
            <div class="route-note" aria-label="Ride format note">
              <span>2 big</span>
              <span>2 small</span>
              <span>cafe?</span>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
